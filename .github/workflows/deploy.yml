# Deploy LearnFlow no GitHub Pages
# Toda vez que você fizer push na branch 'main', o site é rebuildado e publicado automaticamente.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions no GitHub
  workflow_dispatch:

# Impede deploys simultâneos
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build estático
        run: npm run build

      - name: Adicionar .nojekyll
        run: touch out/.nojekyll

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
